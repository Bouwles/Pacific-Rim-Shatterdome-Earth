        padding: 3px 6px;
        border-radius: 4px;
        border: 1px solid rgba(127, 214, 255, 0.4);
        background: rgba(8, 12, 18, 0.85);
        color: #e8f4ff;
      }
      #uiRoot .pilot-comfort label {
        display: flex;
        align-items: center;
        gap: 5px;
        color: #a9c3d6;
      }
      #uiRoot .pilot-comfort input[type="range"] {
        width: 90px;
      }
      #uiRoot .pilot-readout {
        border-top: 1px solid #1d3244;
        padding-top: 6px;
      }
      #uiRoot .pilot-hitlog {
        list-style: none;
        margin: 6px 0 0;
        padding: 0;
        display: flex;
        flex-direction: column;
        gap: 2px;
        font:
          11px/1.35 "Consolas",
          monospace;
        color: #9fd8b4;
      }
      #uiRoot .pilot-hitlog li {
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      #uiRoot .pilot-movelist {
        border-top: 1px solid #1d3244;
        padding-top: 6px;
        max-height: 40vh;
        overflow-y: auto;
        font-size: 12px;
      }
      #uiRoot .pilot-movelist h3 {
        margin: 6px 0 2px;
        font-size: 12px;
        color: #6fd0ff;
      }
      #uiRoot .pilot-movelist ul {
        list-style: none;
        margin: 0;
        padding: 0;
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      #uiRoot .pilot-movelist li {
        display: flex;
        flex-direction: column;
      }
      #uiRoot .pilot-move-name {
        color: #e8f4ff;
      }
      #uiRoot .pilot-move-coaching {
        color: #9fb8c9;
      }
      #uiRoot .pilot-hint {
        margin: 0;
        font-size: 11px;
        color: #7f9fb4;
      }

      /* The save panel is a working list, not a dialog. */
      #uiRoot .screen-saves {
        max-width: none;
        width: min(760px, 90vw);
        max-height: 82vh;
        overflow-y: auto;
        text-align: left;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      #uiRoot .save-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }
      #uiRoot .save-header h2 {
        margin: 0;
      }
      #uiRoot .save-storage,
      #uiRoot .save-warning,
      #uiRoot .save-notice,
      #uiRoot .save-empty {
        margin: 0;
        font-size: 12px;
      }
      #uiRoot .save-warning {
        color: #ffcf87;
      }
      #uiRoot .save-notice[data-kind="error"] {
        color: #ff9a9a;
      }
      #uiRoot .save-notice[data-kind="info"] {
        color: #9fe6b0;
      }
      #uiRoot .save-new {
        display: flex;
        gap: 8px;
        align-items: center;
        flex-wrap: wrap;
      }
      #uiRoot .save-new input[type="text"] {
        flex: 1;
        min-width: 160px;
        font: inherit;
        padding: 6px 10px;
        border-radius: 4px;
        border: 1px solid rgba(127, 214, 255, 0.4);
        background: rgba(8, 12, 18, 0.85);
        color: #e8f4ff;
      }
      #uiRoot .save-import {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 12px;
        color: #a9c3d6;
      }
      #uiRoot .save-import input[type="file"] {
        max-width: 150px;
        font-size: 11px;
        color: #a9c3d6;
      }
      #uiRoot .save-list {
        list-style: none;
        margin: 0;
        padding: 0;
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      #uiRoot .save-row {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 8px 10px;
        border: 1px solid rgba(127, 214, 255, 0.22);
        border-radius: 4px;
        flex-wrap: wrap;
      }
      #uiRoot .save-thumb {
        width: 64px;
        height: 36px;
        object-fit: cover;
        border-radius: 3px;
        order: -1;
      }
      #uiRoot .save-info {
        display: flex;
        flex-direction: column;
        flex: 1;
        min-width: 180px;
      }
      #uiRoot .save-name {
        font-weight: 600;
      }
      #uiRoot .save-detail {
        font:
          11px/1.4 "Consolas",
          monospace;
        color: #7f9fb4;
      }
      #uiRoot .save-row[data-damaged="true"] {
        border-color: rgba(255, 190, 120, 0.5);
      }
      #uiRoot .save-damaged {
        font-size: 11px;
        color: #ffcf87;
      }
      #uiRoot .save-actions {
        display: flex;
        gap: 4px;
        flex-wrap: wrap;
      }
      #uiRoot .save-actions button {
        font-size: 11px;
        padding: 4px 10px;
      }

      /* The gallery is a working panel, not a dialog: it needs room and must not
         cover the asset it is describing. */
      #uiRoot .screen-gallery {
        max-width: none;
        width: min(420px, 34vw);
        text-align: left;
        position: fixed;
        left: 16px;
        top: 16px;
        bottom: 92px;
        display: flex;
        flex-direction: column;
        gap: 10px;
        overflow: hidden;
        font-size: 13px;
      }
      #uiRoot .gallery-header {
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      #uiRoot .gallery-summary {
        margin: 0;
        font-size: 12px;
      }
      #uiRoot .gallery-body {
        display: flex;
        flex-direction: column;
        gap: 10px;
        overflow: hidden;
        flex: 1;
      }
      #uiRoot .gallery-list {
        list-style: none;
        margin: 0;
        padding: 0;
        overflow-y: auto;
        max-height: 40%;
        border: 1px solid rgba(127, 214, 255, 0.2);
        border-radius: 4px;
      }
      #uiRoot .gallery-list button {
        width: 100%;
        text-align: left;
        border: none;
        border-radius: 0;
        background: transparent;
        color: #cfe3f2;
        padding: 5px 10px;
        font-size: 12px;
      }
      #uiRoot .gallery-list button.selected {
        background: rgba(28, 110, 164, 0.55);
        color: #fff;
      }
      #uiRoot .gallery-detail {
        overflow-y: auto;
        font-family: "Consolas", monospace;
        font-size: 12px;
      }
      #uiRoot .gallery-row {
        display: flex;
        gap: 8px;
        padding: 2px 0;
      }
      #uiRoot .gallery-key {
        color: #6f97b0;
        flex: 0 0 108px;
      }
      #uiRoot .gallery-value {
        color: #e8f4ff;
        word-break: break-word;
      }
      #uiRoot .gallery-controls {
        display: flex;
        flex-direction: column;
        gap: 6px;
        font-size: 12px;
      }
      #uiRoot .gallery-controls label {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      #uiRoot .gallery-controls input[type="range"] {
        flex: 1;
      }
    </style>
  </head>
  <body>
    <div id="appRoot">
      <canvas id="renderCanvas"></canvas>
      <div id="contextBanner" hidden></div>
      <div id="uiRoot"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
