<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pacific Rim: Shatterdome Earth</title>
    <link rel="icon" href="data:," />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        overflow: hidden;
        background: #05070a;
      }
      #renderCanvas {
        width: 100vw;
        height: 100vh;
        display: block;
        touch-action: none;
      }

      #diagnosticsPanel {
        position: fixed;
        left: 12px;
        bottom: 10px;
        z-index: 25;
        font:
          12px/1.4 "Consolas",
          monospace;
        color: #7fd6ff;
        text-shadow: 0 0 4px rgba(0, 0, 0, 0.8);
        user-select: none;
      }
      #diagnosticsPanel[hidden] {
        display: none;
      }
      #diagnosticsPanel .diag-readout {
        display: flex;
        flex-wrap: wrap;
        gap: 4px 14px;
        max-width: 70vw;
        pointer-events: none;
      }
      #diagnosticsPanel .diag-label {
        color: #4f7f99;
        margin-right: 4px;
      }
      #diagnosticsPanel .diag-controls {
        display: flex;
        gap: 6px;
        margin-top: 6px;
        pointer-events: auto;
      }
      #diagnosticsPanel .diag-controls button,
      #diagnosticsPanel .diag-controls select {
        font: inherit;
        color: #cfe9f7;
        background: rgba(8, 12, 18, 0.85);
        border: 1px solid rgba(127, 214, 255, 0.4);
        border-radius: 3px;
        padding: 2px 8px;
        cursor: pointer;
      }

      #contextBanner {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        z-index: 30;
        padding: 8px 16px;
        text-align: center;
        font:
          13px/1.4 "Consolas",
          monospace;
        color: #fff;
        background: #7a1f1f;
      }
      #contextBanner[hidden] {
        display: none;
      }

      #uiRoot {
        position: fixed;
        inset: 0;
        z-index: 20;
        display: flex;
        align-items: center;
        justify-content: center;
        pointer-events: none;
      }
      #uiRoot:empty {
        display: none;
      }
      #uiRoot .screen {
        pointer-events: auto;
        background: rgba(8, 12, 18, 0.82);
        border: 1px solid rgba(127, 214, 255, 0.35);
        border-radius: 6px;
        padding: 28px 36px;
        max-width: 420px;
        text-align: center;
        color: #e8f4ff;
        font:
          14px/1.5 "Segoe UI",
          system-ui,
          sans-serif;
      }
      #uiRoot h1 {
        font-size: 20px;
        margin: 0 0 8px;
      }
      #uiRoot h2 {
        font-size: 18px;
        margin: 0 0 8px;
      }
      #uiRoot p {
        margin: 0 0 16px;
        color: #a9c3d6;
      }
      #uiRoot button {
        font: inherit;
        padding: 8px 20px;
        border-radius: 4px;
        cursor: pointer;
        border: 1px solid rgba(127, 214, 255, 0.5);
      }
      #uiRoot .primary-button {
        background: #1c6ea4;
        color: #fff;
      }
      #uiRoot .secondary-button {
        background: transparent;
        color: #a9c3d6;
      }
      #uiRoot .screen-error {
        border-color: rgba(255, 120, 120, 0.5);
      }

      /* World map panel: a readout column, not a dialog. */
      #uiRoot .screen-world {
        max-width: none;
        width: min(420px, 36vw);
        position: fixed;
        left: 16px;
        top: 16px;
        text-align: left;
        display: flex;
        flex-direction: column;
        gap: 10px;
        font-size: 13px;
        /* The streaming readout doubled this panel's height, pushing the walk and
           route buttons off screen and then under the debug overlay, where they
           could not be clicked at all. Stop short of the overlay and scroll the
           readouts inside the panel instead. */
        max-height: calc(100vh - 240px);
        overflow-y: auto;
      }
      /* An author `display` rule outranks the user agent's `[hidden]` rule, so a
         hidden flex row stayed on screen. Important is the right tool here: the
         attribute has to win over every layout rule below, present and future. */
      #uiRoot [hidden] {
        display: none !important;
      }
      #uiRoot .world-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }
      #uiRoot .world-header h2 {
        margin: 0;
      }
      #uiRoot .world-readout {
        font-family: "Consolas", monospace;
        font-size: 12px;
      }
      #uiRoot .world-row {
        display: flex;
        gap: 8px;
        padding: 2px 0;
      }
      #uiRoot .world-key {
        color: #6f97b0;
        flex: 0 0 104px;
      }
      #uiRoot .world-value {
        color: #e8f4ff;
        word-break: break-word;
      }
      #uiRoot .world-teleport {
        display: flex;
        gap: 8px;
        align-items: center;
        flex-wrap: wrap;
      }
      #uiRoot .world-teleport label {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 12px;
      }
      #uiRoot .world-teleport select {
        font: inherit;
        padding: 4px 8px;
        border-radius: 4px;
        border: 1px solid rgba(127, 214, 255, 0.4);
        background: rgba(8, 12, 18, 0.85);
        color: #e8f4ff;
      }
      #uiRoot .world-walk {
        display: flex;
        gap: 6px;
        align-items: center;
      }
      #uiRoot .world-walk-label {
        font-size: 12px;
        color: #a9c3d6;
        margin-right: 4px;
      }
      #uiRoot .world-walk button {
        padding: 4px 12px;
        font-size: 12px;
      }
      #uiRoot .world-view {
        display: flex;
        gap: 6px;
        align-items: center;
      }
      #uiRoot .world-view button {
        padding: 4px 14px;
        font-size: 12px;
      }
      #uiRoot .world-view button.is-active {
        border-color: #6fd0ff;
        color: #eaf8ff;
      }
      /* Streaming instrumentation reads as a second block, not as more coordinates. */
      #uiRoot .world-streaming,
      #uiRoot .world-city,
      #uiRoot .world-environment {
        border-top: 1px solid #1d3244;
        padding-top: 8px;
      }
      #uiRoot .world-streaming .world-key,
      #uiRoot .world-city .world-key,
      #uiRoot .world-environment .world-key {
        color: #86a7bd;
      }
      #uiRoot .world-walk button.is-active {
        border-color: #6fd0ff;
        color: #eaf8ff;
      }
      /* The save panel is a working list, not a dialog. */
      #uiRoot .screen-saves {
        max-width: none;
        width: min(760px, 90vw);
        max-height: 82vh;
        overflow-y: auto;
        text-align: left;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      #uiRoot .save-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }
      #uiRoot .save-header h2 {
        margin: 0;
      }
      #uiRoot .save-storage,
      #uiRoot .save-warning,
      #uiRoot .save-notice,
      #uiRoot .save-empty {
        margin: 0;
        font-size: 12px;
      }
      #uiRoot .save-warning {
        color: #ffcf87;
      }
      #uiRoot .save-notice[data-kind="error"] {
        color: #ff9a9a;
      }
      #uiRoot .save-notice[data-kind="info"] {
        color: #9fe6b0;
      }
      #uiRoot .save-new {
        display: flex;
        gap: 8px;
        align-items: center;
        flex-wrap: wrap;
      }
      #uiRoot .save-new input[type="text"] {
        flex: 1;
        min-width: 160px;
        font: inherit;
        padding: 6px 10px;
        border-radius: 4px;
        border: 1px solid rgba(127, 214, 255, 0.4);
        background: rgba(8, 12, 18, 0.85);
        color: #e8f4ff;
      }
      #uiRoot .save-import {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 12px;
        color: #a9c3d6;
      }
      #uiRoot .save-import input[type="file"] {
        max-width: 150px;
        font-size: 11px;
        color: #a9c3d6;
      }
      #uiRoot .save-list {
        list-style: none;
        margin: 0;
        padding: 0;
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      #uiRoot .save-row {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 8px 10px;
        border: 1px solid rgba(127, 214, 255, 0.22);
        border-radius: 4px;
        flex-wrap: wrap;
      }
      #uiRoot .save-thumb {
        width: 64px;
        height: 36px;
        object-fit: cover;
        border-radius: 3px;
        order: -1;
      }
      #uiRoot .save-info {
        display: flex;
        flex-direction: column;
        flex: 1;
        min-width: 180px;
      }
      #uiRoot .save-name {
        font-weight: 600;
      }
      #uiRoot .save-detail {
        font:
          11px/1.4 "Consolas",
          monospace;
        color: #7f9fb4;
      }
      #uiRoot .save-row[data-damaged="true"] {
        border-color: rgba(255, 190, 120, 0.5);
      }
      #uiRoot .save-damaged {
        font-size: 11px;
        color: #ffcf87;
      }
      #uiRoot .save-actions {
        display: flex;
        gap: 4px;
        flex-wrap: wrap;
      }
      #uiRoot .save-actions button {
        font-size: 11px;
        padding: 4px 10px;
      }

      /* The gallery is a working panel, not a dialog: it needs room and must not
         cover the asset it is describing. */
      #uiRoot .screen-gallery {
        max-width: none;
        width: min(420px, 34vw);
        text-align: left;
        position: fixed;
        left: 16px;
        top: 16px;
        bottom: 92px;
        display: flex;
        flex-direction: column;
        gap: 10px;
        overflow: hidden;
        font-size: 13px;
      }
      #uiRoot .gallery-header {
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      #uiRoot .gallery-summary {
        margin: 0;
        font-size: 12px;
      }
      #uiRoot .gallery-body {
        display: flex;
        flex-direction: column;
        gap: 10px;
        overflow: hidden;
        flex: 1;
      }
      #uiRoot .gallery-list {
        list-style: none;
        margin: 0;
        padding: 0;
        overflow-y: auto;
        max-height: 40%;
        border: 1px solid rgba(127, 214, 255, 0.2);
        border-radius: 4px;
      }
      #uiRoot .gallery-list button {
        width: 100%;
        text-align: left;
        border: none;
        border-radius: 0;
        background: transparent;
        color: #cfe3f2;
        padding: 5px 10px;
        font-size: 12px;
      }
      #uiRoot .gallery-list button.selected {
        background: rgba(28, 110, 164, 0.55);
        color: #fff;
      }
      #uiRoot .gallery-detail {
        overflow-y: auto;
        font-family: "Consolas", monospace;
        font-size: 12px;
      }
      #uiRoot .gallery-row {
        display: flex;
        gap: 8px;
        padding: 2px 0;
      }
      #uiRoot .gallery-key {
        color: #6f97b0;
        flex: 0 0 108px;
      }
      #uiRoot .gallery-value {
        color: #e8f4ff;
        word-break: break-word;
      }
      #uiRoot .gallery-controls {
        display: flex;
        flex-direction: column;
        gap: 6px;
        font-size: 12px;
      }
      #uiRoot .gallery-controls label {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      #uiRoot .gallery-controls input[type="range"] {
        flex: 1;
      }
    </style>
  </head>
  <body>
    <div id="appRoot">
      <canvas id="renderCanvas"></canvas>
      <div id="contextBanner" hidden></div>
      <div id="uiRoot"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
