# Builds the game and publishes dist/ to the gh-pages branch on every push to
# main. GitHub Pages serves that branch. The build is relative-URL only (see
# vite.config.ts), so it runs from the repository subfolder Pages gives it.
# No secrets beyond the workflow's own token, no external services, no
# third-party actions for the publish step.
name: Publish to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Push dist to gh-pages
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # The published commit carries the same author as the source commit,
          # so the branch adds nobody to the repository's history.
          NAME="$(git log -1 --format='%an')"
          EMAIL="$(git log -1 --format='%ae')"
          cd dist
          git init -q -b gh-pages
          git config user.name "$NAME"
          git config user.email "$EMAIL"
          git add -A
          git commit -q -m "Publish ${GITHUB_SHA::7}"
          git push -q --force "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
